name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request stops the run it makes old.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: Python tools compile
        run: python -m py_compile tools/corpus/census.py tools/corpus/schema_catalog.py tools/corpus/layer_census.py tools/corpus/value_census.py tools/corpus/schema_doc.py tools/validation/python_reader_check.py tools/validation/name_splitter_check.py tools/validation/assets_python_check.py tools/assets/subtool_census.py tools/assets/subtool_columns.py tools/assets/sqlite_census.py
      - name: Python reader tests
        run: python -m unittest discover -s python/tests -v
      - name: Python reader matches the Rust crate (V7, fixture)
        shell: bash
        run: |
          cargo build --example layer_digest -p csp-lab
          python tools/validation/python_reader_check.py python/tests/data python/tests/data/files.txt v7.jsonl --digest target/debug/examples/layer_digest
          python -c "import json, sys; r = [json.loads(l) for l in open('v7.jsonl')]; print(r); sys.exit(0 if r and all(x['ok'] for x in r) else 1)"
      - name: Python asset reader matches the Rust crate (W5, synthetic files)
        shell: bash
        run: |
          cargo build --example asset_fixtures --example asset_digest -p csp-lab
          target/debug/examples/asset_fixtures w5-fixtures
          python tools/validation/assets_python_check.py w5-fixtures w5.jsonl --digest target/debug/examples/asset_digest

  msrv:
    name: Minimum Rust version (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust 1.89 (rust-version in Cargo.toml)
        run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +1.89 check --workspace --all-targets --locked

  audit:
    name: Known vulnerabilities in the libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      # RustSec advisories against Cargo.lock: a vulnerability fails the run.
      - run: cargo audit

  package:
    name: Documentation and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (the version in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Actions are named by their commit, and no workflow may write as a whole
        run: python3 tools/release/workflow_pins.py
      - name: API documentation builds without warnings
        run: cargo doc --no-deps -p csp-format -p csp-assets
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Crates package and build from the packaged sources
        run: cargo package --workspace --exclude csp-lab --locked
      - name: Each crate carries the license
        run: |
          for crate in target/package/*.crate; do
            echo "$crate"
            tar -xzOf "$crate" --wildcards '*/LICENSE' | cmp - LICENSE
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Package READMEs link to the repository with absolute links
        run: |
          python tools/release/readme_links.py crates/*/README.md python/README.md
          mkdir /tmp/archive && cp README.md README.en.md CHANGELOG.md /tmp/archive/
          python tools/release/readme_links.py --base "https://github.com/${GITHUB_REPOSITORY}/blob/main/" \
            --keep README.md --keep README.en.md --keep LICENSE --keep CHANGELOG.md /tmp/archive/*.md
      - name: Python package installs with every module
        run: |
          python -m pip install --upgrade build
          python -m build python --outdir dist
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "import csp_format, csp_format.assets; print(csp_format.__version__)"
      - name: Wheel and sdist carry the license; the sdist's tests pass on their own
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'dist-info/licenses/LICENSE'
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cmp /tmp/sdist/*/LICENSE LICENSE
          cd /tmp/sdist/* && python -I -m unittest discover -s tests -v
      - name: License copies match the repository's
        run: for copy in crates/*/LICENSE python/LICENSE; do cmp "$copy" LICENSE; done
