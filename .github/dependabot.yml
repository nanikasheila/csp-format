# Weekly proposals to raise the libraries, the Rust version and the Actions.
# Each is a pull request that CI checks like any other; patch and minor raises
# come as one pull request per kind to keep the list short.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
